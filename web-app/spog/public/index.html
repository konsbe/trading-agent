<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Trading Agent</title>
   <link rel="preconnect" href="https://fonts.googleapis.com" />
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
</head>
<body>
   <noscript>You need to enable JavaScript to run this app.</noscript>
   <div id="root"></div>
   <script>
     (function(){fetch('/config.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(c){window.__APP_CONFIG__=c;var s=document.createElement('script');s.src=c.shell_spog&&c.shell_spog.mainJsUrl;s.defer=true;document.head.appendChild(s);}).catch(function(e){console.error('[trading-agent] Failed to load config',e);});})();
   </script>
</body>

</html>
