# Every service reads and writes the LIVE database: the `ta-phase1` container
# (published on host port 55442), reached through the Docker host gateway. The
# `timescaledb` service below is the old Compose database, stopped since April
# 2026 and holding stale data; it is kept only behind the `legacy-db` profile.
# Pointing a service back at it is how analyst-bot crash-looped for five months.
# Override with COMPOSE_DATABASE_URL (e.g. for a throwaway test database).
x-live-db-url: &live-db-url ${COMPOSE_DATABASE_URL:-postgres://postgres:pg@host.docker.internal:55442/trading?sslmode=disable}
x-live-db-hosts: &live-db-hosts
  - "host.docker.internal:host-gateway"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    profiles: [legacy-db]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading
    command: >
      postgres
      -c max_locks_per_transaction=256
      -c max_connections=200
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ../shared/databases/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  data-crypto:
    build:
      context: ../services/data-ingestion
      dockerfile: Dockerfile
    command: ["/app/data-crypto"]
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *live-db-hosts
    environment:
      DATABASE_URL: *live-db-url
    profiles: [ingestion]
    restart: on-failure

  data-equity:
    build:
      context: ../services/data-ingestion
      dockerfile: Dockerfile
    command: ["/app/data-equity"]
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *live-db-hosts
    environment:
      DATABASE_URL: *live-db-url
    volumes:
      - ${CORP_CA_PEM_PATH:-/dev/null}:/etc/ssl/extra/corp-ca.pem:ro
    profiles: [ingestion]
    restart: on-failure

  data-onchain:
    build:
      context: ../services/data-ingestion
      dockerfile: Dockerfile
    command: ["/app/data-onchain"]
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *live-db-hosts
    environment:
      DATABASE_URL: *live-db-url
    profiles: [ingestion]
    restart: on-failure

  data-sentiment:
    build:
      context: ../services/data-ingestion
      dockerfile: Dockerfile
    command: ["/app/data-sentiment"]
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *live-db-hosts
    environment:
      DATABASE_URL: *live-db-url
    volumes:
      - ${CORP_CA_PEM_PATH:-/dev/null}:/etc/ssl/extra/corp-ca.pem:ro
    profiles: [ingestion]
    restart: on-failure

  data-fundamental:
    build:
      context: ../services/data-ingestion
      dockerfile: Dockerfile
    command: ["/app/data-fundamental"]
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *live-db-hosts
    environment:
      DATABASE_URL: *live-db-url
    volumes:
      - ${CORP_CA_PEM_PATH:-/dev/null}:/etc/ssl/extra/corp-ca.pem:ro
    profiles: [ingestion]
    restart: on-failure

  data-technical:
    build:
      context: ../services/data-ingestion
      dockerfile: Dockerfile
    command: ["/app/data-technical"]
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *live-db-hosts
    environment:
      DATABASE_URL: *live-db-url
    profiles: [ingestion]
    restart: on-failure

  # Calendars (Finnhub), GPR CSV, GDELT doc tone, RSS macro feeds → macro_* tables + tagged news_headlines.
  data-macro-intel:
    build:
      context: ../services/data-ingestion
      dockerfile: Dockerfile
    command: ["/app/data-macro-intel"]
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *live-db-hosts
    environment:
      DATABASE_URL: *live-db-url
    volumes:
      - ${CORP_CA_PEM_PATH:-/dev/null}:/etc/ssl/extra/corp-ca.pem:ro
    profiles: [ingestion]
    restart: on-failure

  # Eligible US common-stock universe for the momentum scanner (§3.1 / §8.1).
  # Weekly symbol-list refresh + weekly sector/shares/market-cap refresh.
  # Requires FINNHUB_API_KEY for the symbol list; without it that pass is
  # skipped with a warning and the service keeps running.
  data-universe:
    build:
      context: ../services/data-ingestion
      dockerfile: Dockerfile
    command: ["/app/data-universe"]
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *live-db-hosts
    environment:
      DATABASE_URL: *live-db-url
    volumes:
      - ${CORP_CA_PEM_PATH:-/dev/null}:/etc/ssl/extra/corp-ca.pem:ro
    profiles: [ingestion]
    # unless-stopped, not on-failure: the daily bars feed momentum-daily, and
    # on-failure containers are not brought back when Docker itself restarts.
    restart: unless-stopped

  # ── data-analyzer ──────────────────────────────────────────────────────────
  # Reads bars / fundamentals from TimescaleDB and writes computed indicators
  # and derived fundamental scores. No external API calls are made here.
  # Start with: make up-analyzer
  # or alongside ingestion: make up

  technical-analysis:
    build:
      context: ../services/data-analyzer
      dockerfile: Dockerfile
    command: ["/app/technical-analysis"]
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *live-db-hosts
    environment:
      DATABASE_URL: *live-db-url
      # Cross-profile depends_on (data-technical is in 'ingestion') is not supported
      # when running --profile analyzer alone. Startup delay handles timing instead:
      # ANALYZER_STARTUP_DELAY_SECS (default 180) gives ingestion time to populate OHLCV.
    profiles: [analyzer]
    restart: on-failure

  fundamental-analysis:
    build:
      context: ../services/data-analyzer
      dockerfile: Dockerfile
    command: ["/app/fundamental-analysis"]
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *live-db-hosts
    environment:
      DATABASE_URL: *live-db-url
      # Cross-profile depends_on (data-fundamental is in 'ingestion') is not supported
      # when running --profile analyzer alone. FUNDAMENTAL_STARTUP_DELAY_SECS handles timing.
    profiles: [analyzer]
    restart: on-failure

  macro-analysis:
    build:
      context: ../services/data-analyzer
      dockerfile: Dockerfile
    command: ["/app/macro-analysis"]
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *live-db-hosts
    environment:
      DATABASE_URL: *live-db-url
      # data-equity (ingestion profile) populates macro_fred. FRED data is fetched
      # weekly/monthly so a 60-second startup delay is sufficient.
    profiles: [analyzer]
    restart: on-failure

  market-operations:
    build:
      context: ../services/data-analyzer
      dockerfile: Dockerfile
    command: ["/app/market-operations"]
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *live-db-hosts
    environment:
      DATABASE_URL: *live-db-url
    profiles: [analyzer]
    restart: on-failure

  # ── momentum-daily ─────────────────────────────────────────────────────────
  # The momentum chain, once per NYSE session: waits until that session's daily
  # bars have landed (data-universe, ingestion profile), then runs
  # momentum-scanner and momentum-tracker in that order. Missed sessions are not
  # backfilled. The analyst-bot alerts only once this session's scan exists.
  momentum-daily:
    build:
      context: ../services/data-analyzer
      dockerfile: Dockerfile
    command: ["/app/momentum-daily"]
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *live-db-hosts
    environment:
      DATABASE_URL: *live-db-url
      MOMENTUM_DAILY_BIN_DIR: /app
    profiles: [analyzer]
    restart: unless-stopped

  # ── momentum-api ───────────────────────────────────────────────────────────
  # Read-only HTTP API over the momentum scanner's stored output for the web app
  # (docs/MOMENTUM_SCANNER_API.md). Start with: make up-api
  #
  # NO AUTHENTICATION. Published on 127.0.0.1 only — never change the host side
  # of `ports` to 0.0.0.0 or expose it beyond this machine until real auth
  # exists (see services/data-analyzer/cmd/momentum-api/README.md).
  momentum-api:
    build:
      context: ../services/data-analyzer
      dockerfile: Dockerfile
    command: ["/app/momentum-api"]
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *live-db-hosts
    environment:
      DATABASE_URL: *live-db-url
      # Listens on all interfaces INSIDE the container; the host port is loopback-only.
      MOMENTUM_API_ADDR: 0.0.0.0:8090
      MOMENTUM_CAVEATS_PATH: /shared/content/momentum_caveats.json
    volumes:
      - ../shared/content:/shared/content:ro
    ports:
      - "127.0.0.1:8090:8090"
    profiles: [api]
    restart: on-failure

  # ── analyst-bot ────────────────────────────────────────────────────────────
  # Discord bot + scheduler. Reads from TimescaleDB and Redis — no API calls.
  # Start with: make up-bot  (or docker compose --profile bot up -d analyst-bot)
  # Requires DISCORD_BOT_TOKEN in .env.
  analyst-bot:
    build:
      context: ../services/analyst-bot
      dockerfile: Dockerfile
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *live-db-hosts
    environment:
      DATABASE_URL: *live-db-url
      REDIS_URL: redis://redis:6379/0
      # EVIDENCE_CAVEAT / RESEARCH_SCORE_CAVEAT, shared with momentum-api.
      MOMENTUM_CAVEATS_PATH: /shared/content/momentum_caveats.json
    volumes:
      - ../shared/content:/shared/content:ro
    depends_on:
      redis:
        condition: service_started
    profiles: [bot]
    restart: unless-stopped

volumes:
  timescale_data:
